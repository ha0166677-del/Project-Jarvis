<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. | Stark Industries Interface</title>
    <style>
        :root {
            --stark-blue: #00f0ff;
            --stark-gold: #ffb700;
            --stark-bg: #050b14;
            --stark-panel: rgba(10, 25, 45, 0.85);
            --stark-border: rgba(0, 240, 255, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background-color: var(--stark-bg);
            color: var(--stark-blue);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .hud-header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--stark-blue);
            padding-bottom: 10px;
            width: 100%;
            max-width: 600px;
        }

        .hud-header h1 {
            font-size: 2rem;
            letter-spacing: 4px;
            text-shadow: 0 0 10px var(--stark-blue);
        }

        .hud-header p {
            font-size: 0.85rem;
            color: var(--stark-gold);
            letter-spacing: 2px;
            margin-top: 5px;
        }

        .reactor-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 15px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .core {
            width: 40px;
            height: 40px;
            background: var(--stark-blue);
            border-radius: 50%;
            box-shadow: 0 0 25px var(--stark-blue), inset 0 0 10px #ffffff;
            animation: pulse 2s infinite alternate;
        }

        .ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 3px dashed var(--stark-border);
            border-radius: 50%;
            animation: spin 10s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0% { transform: scale(0.95); opacity: 0.8; } 100% { transform: scale(1.05); opacity: 1; } }

        .hud-panel {
            background: var(--stark-panel);
            border: 1px solid var(--stark-border);
            border-radius: 10px;
            padding: 20px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.15);
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--stark-blue);
            color: var(--stark-blue);
            border-radius: 5px;
            font-size: 1rem;
            outline: none;
        }

        button {
            padding: 12px 20px;
            background: rgba(0, 240, 255, 0.1);
            color: var(--stark-blue);
            border: 1px solid var(--stark-blue);
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: var(--stark-blue);
            color: var(--stark-bg);
            box-shadow: 0 0 15px var(--stark-blue);
        }

        .mic-btn {
            background: rgba(255, 183, 0, 0.1);
            color: var(--stark-gold);
            border-color: var(--stark-gold);
        }

        .output-screen {
            background: rgba(0, 0, 0, 0.7);
            border: 1px dashed var(--stark-border);
            padding: 15px;
            min-height: 80px;
            border-radius: 5px;
            text-align: left;
            font-family: monospace;
            font-size: 0.95rem;
            color: #ffffff;
            margin-bottom: 15px;
        }

        .section-title {
            font-size: 0.85rem;
            color: var(--stark-gold);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            text-align: left;
        }

        .memory-box {
            font-size: 0.85rem;
            color: #a0aec0;
            text-align: left;
            max-height: 100px;
            overflow-y: auto;
            padding: 8px;
            background: rgba(0,0,0,0.3);
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="hud-header">
        <h1>J.A.R.V.I.S.</h1>
        <p>JUST A RATHER VERY INTELLIGENT SYSTEM // STARK PROTOCOL</p>
    </div>

    <div class="reactor-container">
        <div class="ring"></div>
        <div class="core"></div>
    </div>

    <div class="hud-panel">
        <div class="input-group">
            <input type="text" id="userInput" placeholder="Speak or type anything naturally...">
            <button onclick="sendCommand()">SEND</button>
            <button class="mic-btn" onclick="startListening()">🎤 SPEAK</button>
        </div>

        <div class="section-title">HUD Output Log</div>
        <div id="responseBox" class="output-screen">Systems calibrated, Sir. Ready for input.</div>

        <div class="section-title">Active Memory & Goals</div>
        <div id="memoryDisplay" class="memory-box">No active data logs stored yet.</div>
    </div>

    <script>
        let jarvisMemory = JSON.parse(localStorage.getItem('jarvis_memory')) || [];
        updateMemoryUI();

        // Optimized Voice Settings
        function speak(text) {
            const speech = new SpeechSynthesisUtterance(text);
            speech.lang = "en-GB";
            speech.rate = 0.98; // Natural speech speed
            speech.pitch = 0.90; // Natural deeper pitch

            const voices = window.speechSynthesis.getVoices();
            // Searches for high quality male British or natural voices
            const preferredVoice = voices.find(v => 
                (v.name.includes("Daniel") || v.name.includes("Arthur") || v.name.includes("Oliver") || v.name.includes("Male")) && v.lang.includes("en")
            );

            if (preferredVoice) {
                speech.voice = preferredVoice;
            }

            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(speech);
        }

        function respond(message) {
            document.getElementById("responseBox").innerText = `> ${message}`;
        }

        function updateMemoryUI() {
            const memBox = document.getElementById("memoryDisplay");
            if (jarvisMemory.length === 0) {
                memBox.innerText = "No active data logs stored yet.";
            } else {
                memBox.innerHTML = jarvisMemory.map(item => `• ${item}`).join('<br>');
            }
        }

        // Natural Language Command Processing
        function processCommand(rawCommand) {
            const command = rawCommand.toLowerCase().trim();
            document.getElementById("userInput").value = rawCommand;

            // 1. Web Navigation Intent (detects site names or "open / launch / take me to")
            const siteMatch = command.match(/(?:open|launch|go to|take me to|show me)\s+([a-z0-9\s]+)/i);
            if (siteMatch || command.includes("youtube") || command.includes("google") || command.includes("github")) {
                let targetSite = siteMatch ? siteMatch[1].trim() : "";
                if (command.includes("youtube")) targetSite = "youtube";
                else if (command.includes("google")) targetSite = "google";
                else if (command.includes("github")) targetSite = "github";

                const cleanSite = targetSite.replace(/\s+/g, "");
                const reply = `Opening ${targetSite} for you now, Sir.`;
                respond(reply);
                speak(reply);
                window.open(`https://www.${cleanSite}.com`, "_blank");
                return;
            }

            // 2. Memory / Goal Storing Intent
            if (command.includes("remember") || command.includes("my goal") || command.includes("save this") || command.includes("dont forget") || command.includes("don't forget")) {
                const memoryContent = rawCommand.replace(/(?:remember|my goal is to|save this|dont forget that|don't forget that|to)\s*/i, "").trim();
                if (memoryContent) {
                    jarvisMemory.push(memoryContent);
                    localStorage.setItem('jarvis_memory', JSON.stringify(jarvisMemory));
                    updateMemoryUI();
                    const reply = `Logged to memory: "${memoryContent}".`;
                    respond(reply);
                    speak("I have noted that down in memory, Sir.");
                    return;
                }
            }

            // 3. Memory Recall Intent
            if (command.includes("memory") || command.includes("goals") || command.includes("what do you know") || command.includes("what did i tell you")) {
                if (jarvisMemory.length === 0) {
                    const reply = "Memory banks are currently clear, Sir.";
                    respond(reply);
                    speak(reply);
                } else {
                    const reply = `Stored logs: ${jarvisMemory.join(', ')}`;
                    respond(reply);
                    speak("Displaying your stored goals and notes now, Sir.");
                }
                return;
            }

            // 4. Clear Memory Intent
            if (command.includes("clear memory") || command.includes("reset memory") || command.includes("delete goals")) {
                jarvisMemory = [];
                localStorage.removeItem('jarvis_memory');
                updateMemoryUI();
                const reply = "Memory logs reset, Sir.";
                respond(reply);
                speak(reply);
                return;
            }

            // 5. Conversational Responses (Rotates natural responses)
            const greetings = ["how are you", "hello", "hi jarvis", "hey jarvis", "sup", "what's up"];
            if (greetings.some(g => command.includes(g))) {
                const responses = [
                    "Always a pleasure, Sir. How can I help you today?",
                    "All core systems operational. What are we working on?",
                    "Standing by, Sir. Ready for your instructions."
                ];
                const reply = responses[Math.floor(Math.random() * responses.length)];
                respond(reply);
                speak(reply);
                return;
            }

            // Default conversational fallback
            const fallbackReply = `Processing: "${rawCommand}". I've logged your input, Sir.`;
            respond(fallbackReply);
            speak("Understood, Sir.");
        }

        function sendCommand() {
            const inputField = document.getElementById("userInput");
            if (inputField.value.trim() !== "") {
                processCommand(inputField.value);
            }
        }

        function startListening() {
            window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!window.SpeechRecognition) {
                alert("Speech recognition is not supported in this browser. Try Safari or Chrome.");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = "en-US";
            
            respond("Listening for voice command...");
            speak("Listening");

            recognition.onresult = function(event) {
                const speechToText = event.results[0][0].transcript;
                processCommand(speechToText);
            };

            recognition.onerror = function() {
                respond("Microphone input error.");
            };

            recognition.start();
        }
    </script>
</body>
</html>
