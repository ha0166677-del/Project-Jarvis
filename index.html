<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. | Stark Industries Interface</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #00f0ff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            letter-spacing: 4px;
            margin-bottom: 5px;
            text-shadow: 0 0 10px #00f0ff;
        }

        .subtitle {
            font-size: 0.8rem;
            color: #ff9d00;
            letter-spacing: 2px;
            margin-bottom: 25px;
        }

        .arc-reactor {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffffff 0%, #00f0ff 60%, transparent 100%);
            box-shadow: 0 0 25px #00f0ff;
            margin-bottom: 25px;
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 15px #00f0ff; }
            50% { transform: scale(1.05); box-shadow: 0 0 30px #00f0ff; }
            100% { transform: scale(0.95); box-shadow: 0 0 15px #00f0ff; }
        }

        .hud-panel {
            background: rgba(11, 25, 44, 0.7);
            border: 1px solid #00f0ff;
            border-radius: 8px;
            padding: 20px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
            margin-bottom: 15px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            flex: 1;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #00f0ff;
            color: #ffffff;
            padding: 12px;
            border-radius: 4px;
            outline: none;
            font-size: 1rem;
        }

        input[type="text"]:focus {
            box-shadow: 0 0 8px #00f0ff;
        }

        button {
            background: transparent;
            border: 1px solid #00f0ff;
            color: #00f0ff;
            padding: 12px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 1px;
            transition: all 0.2s ease;
        }

        button:hover {
            background: #00f0ff;
            color: #0b0f19;
            box-shadow: 0 0 10px #00f0ff;
        }

        .output-box {
            min-height: 80px;
            background: rgba(0, 0, 0, 0.4);
            border-left: 3px solid #ff9d00;
            padding: 12px;
            font-family: monospace;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>
<body>

    <h1>J.A.R.V.I.S.</h1>
    <div class="subtitle">JUST A RATHER VERY INTELLIGENT SYSTEM // GEMINI PROTOCOL</div>

    <div class="arc-reactor"></div>

    <div class="hud-panel">
        <div class="input-group">
            <input type="text" id="userInput" placeholder="Ask Gemini-JARVIS anything..." onkeydown="if(event.key === 'Enter') handleSend()">
            <button onclick="handleSend()">SEND</button>
            <button onclick="startListening()">⚡ SPEAK</button>
        </div>

        <div style="font-size: 0.8rem; color: #ff9d00; margin-bottom: 5px;">HUD OUTPUT LOG</div>
        <div id="output" class="output-box">Neural link established. Awaiting input, Sir.</div>
    </div>

    <script>
        // Insert your valid Google Gemini API Key below
        const GEMINI_API_KEY = "AQ.Ab8RN6JBTkX2WVN40b8VGCEBTLHmDhLtICOhAUZl4jWRTWpMQg"; 

        function respond(text) {
            const outputElement = document.getElementById("output");
            if (outputElement) {
                outputElement.textContent = text;
            }
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 1.0;
                utterance.pitch = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        async function queryGemini(promptText) {
            respond("Processing request, Sir...");
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: promptText }]
                        }]
                    })
                });

                const data = await response.json();

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const reply = data.candidates[0].content.parts[0].text;
                    respond("J.A.R.V.I.S.: " + reply);
                    speak(reply);
                } else {
                    respond("J.A.R.V.I.S.: Unable to parse response from server.");
                }
            } catch (error) {
                console.error("Gemini API Error:", error);
                respond("J.A.R.V.I.S.: Error connecting to core system.");
            }
        }

        function processCommand(text) {
            if (!text) return;
            respond("Sir: " + text);
            queryGemini(text);
        }

        function handleSend() {
            const inputField = document.getElementById('userInput');
            if (!inputField) return;
            const text = inputField.value.trim();
            if (text) {
                processCommand(text);
                inputField.value = '';
            }
        }

        // Helper alias to prevent function naming errors
        function sendCommand() {
            handleSend();
        }

        function startListening() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Speech recognition is not supported in this browser. Try Safari or Chrome.");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = "en-US";

            respond("Listening...");
            speak("Listening");

            recognition.onresult = function(event) {
                const speechToText = event.results[0][0].transcript;
                processCommand(speechToText);
            };

            recognition.onerror = function(event) {
                respond("Microphone error.");
            };

            recognition.start();
        }
    </script>
</body>
</html>
