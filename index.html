<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. | Stark Industries Interface</title>
    <style>
        :root {
            --stark-blue: #00f0ff;
            --stark-gold: #ffb700;
            --stark-bg: #050b14;
            --stark-panel: rgba(10, 25, 45, 0.85);
            --stark-border: rgba(0, 240, 255, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background-color: var(--stark-bg);
            color: var(--stark-blue);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .hud-header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--stark-blue);
            padding-bottom: 10px;
            width: 100%;
            max-width: 600px;
        }

        .hud-header h1 {
            font-size: 2rem;
            letter-spacing: 4px;
            text-shadow: 0 0 10px var(--stark-blue);
        }

        .hud-header p {
            font-size: 0.85rem;
            color: var(--stark-gold);
            letter-spacing: 2px;
            margin-top: 5px;
        }

        .reactor-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 15px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .core {
            width: 40px;
            height: 40px;
            background: var(--stark-blue);
            border-radius: 50%;
            box-shadow: 0 0 25px var(--stark-blue), inset 0 0 10px #ffffff;
            animation: pulse 2s infinite alternate;
        }

        .ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 3px dashed var(--stark-border);
            border-radius: 50%;
            animation: spin 10s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0% { transform: scale(0.95); opacity: 0.8; } 100% { transform: scale(1.05); opacity: 1; } }

        .hud-panel {
            background: var(--stark-panel);
            border: 1px solid var(--stark-border);
            border-radius: 10px;
            padding: 20px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.15);
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--stark-blue);
            color: var(--stark-blue);
            border-radius: 5px;
            font-size: 1rem;
            outline: none;
        }

        button {
            padding: 12px 20px;
            background: rgba(0, 240, 255, 0.1);
            color: var(--stark-blue);
            border: 1px solid var(--stark-blue);
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: var(--stark-blue);
            color: var(--stark-bg);
            box-shadow: 0 0 15px var(--stark-blue);
        }

        .mic-btn {
            background: rgba(255, 183, 0, 0.1);
            color: var(--stark-gold);
            border-color: var(--stark-gold);
        }

        .output-screen {
            background: rgba(0, 0, 0, 0.7);
            border: 1px dashed var(--stark-border);
            padding: 15px;
            min-height: 90px;
            border-radius: 5px;
            text-align: left;
            font-family: monospace;
            font-size: 0.95rem;
            color: #ffffff;
            margin-bottom: 15px;
            white-space: pre-wrap;
        }

        .section-title {
            font-size: 0.85rem;
            color: var(--stark-gold);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            text-align: left;
        }

        .memory-box {
            font-size: 0.85rem;
            color: #a0aec0;
            text-align: left;
            max-height: 100px;
            overflow-y: auto;
            padding: 8px;
            background: rgba(0,0,0,0.3);
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="hud-header">
        <h1>J.A.R.V.I.S.</h1>
        <p>JUST A RATHER VERY INTELLIGENT SYSTEM // GEMINI PROTOCOL</p>
    </div>

    <div class="reactor-container">
        <div class="ring"></div>
        <div class="core"></div>
    </div>

    <div class="hud-panel">
        <div class="input-group">
            <input type="text" id="userInput" placeholder="Ask Gemini-JARVIS anything..." onkeydown="if(event.key === 'Enter') sendCommand()">
            <button onclick="sendCommand()">SEND</button>
            <button class="mic-btn" onclick="startListening()">🎤 SPEAK</button>
        </div>

        <div class="section-title">HUD Output Log</div>
        <div id="responseBox" class="output-screen">Neural link established. Awaiting input, Sir.</div>

        <div class="section-title">Local Memory & Goals</div>
        <div id="memoryDisplay" class="memory-box">No active local goals logged.</div>
    </div>

    <script>
        // PASTE YOUR GEMINI API KEY INSIDE THE QUOTES BELOW (ONLY ONCE):
        const GEMINI_API_KEY = "AQ.Ab8RN6LcdPufLv8X7Gy9w2qPD8zfBvIIM3LAn6vNr_kE7Hf45w";

        let jarvisMemory = JSON.parse(localStorage.getItem('jarvis_memory')) || [];
        updateMemoryUI();

        function speak(text) {
            const speech = new SpeechSynthesisUtterance(text);
            speech.lang = "en-GB";
            speech.rate = 0.98;
            speech.pitch = 0.90;

            const voices = window.speechSynthesis.getVoices();
            const preferredVoice = voices.find(v => 
                (v.name.includes("Daniel") || v.name.includes("Arthur") || v.name.includes("Oliver") || v.name.includes("Male")) && v.lang.includes("en")
            );

            if (preferredVoice) {
                speech.voice = preferredVoice;
            }

            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(speech);
        }

        function respond(message) {
            document.getElementById("responseBox").innerText = `> ${message}`;
        }

        function updateMemoryUI() {
            const memBox = document.getElementById("memoryDisplay");
            if (jarvisMemory.length === 0) {
                memBox.innerText = "No active local goals logged.";
            } else {
                memBox.innerHTML = jarvisMemory.map(item => `• ${item}`).join('<br>');
            }
        }

        // Send prompt to Gemini API with JARVIS Persona using Gemini 3.8 Flash
        async function queryGemini(userPrompt) {
            if (GEMINI_API_KEY === "YOUR_API_KEY_HERE" || !GEMINI_API_KEY) {
                respond("Error: Please insert your Google Gemini API key into the code.");
                speak("Sir, you forgot to enter your API key in the script.");
                return;
            }

            respond("Consulting neural network...");

            const systemPrompt = "You are J.A.R.V.I.S., Tony Stark's witty, polite, highly intelligent British AI assistant. Always address the user as Sir. Keep your answers relatively short, sharp, and natural so they sound great spoken out loud.";
            const fullPrompt = `${systemPrompt}\n\nUser Goals/Context Stored: ${jarvisMemory.join(', ')}\n\nUser says: ${userPrompt}`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: fullPrompt }] }]
                    })
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    let aiReply = data.candidates[0].content.parts[0].text.trim();
                    respond(aiReply);
                    speak(aiReply);
                } else if (data.error) {
                    respond(`API Error: ${data.error.message}`);
                    speak("API error encountered, Sir.");
                } else {
                    respond("Neural link returned an empty response, Sir.");
                    speak("I encountered a glitch, Sir.");
                }
            } catch (error) {
                respond("Network connection error to Gemini servers.");
                speak("Connection error, Sir.");
            }
        }

        function processCommand(rawCommand) {
            const command = rawCommand.toLowerCase().trim();
            document.getElementById("userInput").value = rawCommand;

            if (command.startsWith("open ") || command.includes("youtube") || command.includes("google")) {
                let targetSite = "google";
                if (command.includes("youtube")) targetSite = "youtube";
                else if (command.includes("google")) targetSite = "google";
                else {
                    let siteMatch = command.match(/(?:open|launch|go to)\s+([a-z0-9\s]+)/i);
                    if (siteMatch) targetSite = siteMatch[1].trim().replace(/\s+/g, "");
                }

                const reply = `Opening ${targetSite} for you right away, Sir.`;
                respond(reply);
                speak(reply);
                window.open(`https://www.${targetSite}.com`, "_blank");
                return;
            }

            if (command.startsWith("remember ") || command.startsWith("goal ")) {
                const dataToStore = rawCommand.replace(/^(remember|goal)\s*/i, "").trim();
                jarvisMemory.push(dataToStore);
                localStorage.setItem('jarvis_memory', JSON.stringify(jarvisMemory));
                updateMemoryUI();
                const reply = `Goal logged locally: "${dataToStore}"`;
                respond(reply);
                speak("I have noted that into your local goals, Sir.");
                return;
            }

            queryGemini(rawCommand);
        }

        function sendCommand() {
            const inputField = document.getElementById("userInput");
            if (inputField.value.trim() !== "") {
                processCommand(inputField.value);
                inputField.value = "";
            }
        }

        function startListening() {
            window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!window.SpeechRecognition) {
                alert("Speech recognition is not supported in this browser. Try Safari or Chrome.");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = "en-US";
            
            respond("Listening...");
            speak("Listening");

            recognition.onresult = function(event) {
                const speechToText = event.results[0][0].transcript;
                processCommand(speechToText);
            };

            recognition.onerror = function() {
                respond("Microphone error.");
            };

            recognition.start();
        }
    </script>
</body>
</html>
