<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS AI</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #050b16;
    color: #66d9ff;
    font-family: Arial, sans-serif;
    text-align: center;
}

header {
    padding: 25px;
    border-bottom: 1px solid #164c70;
}

h1 {
    letter-spacing: 8px;
    font-size: 35px;
    text-shadow: 0 0 15px #00aaff;
}

.status {
    color: #00ffae;
    font-size: 13px;
}

.container {
    max-width: 750px;
    margin: auto;
    padding: 20px;
}

.circle {
    width: 170px;
    height: 170px;
    border: 3px solid #00bfff;
    border-radius: 50%;
    margin: 25px auto;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 65px;
    box-shadow: 0 0 30px #008cff;
}

button {
    background: #092d48;
    color: #70ddff;
    border: 1px solid #00aeef;
    padding: 13px 18px;
    margin: 6px;
    border-radius: 8px;
    font-size: 15px;
}

button:active {
    background: #0874a8;
}

input {
    width: 90%;
    padding: 14px;
    margin: 10px;
    background: #101d2d;
    border: 1px solid #008dcc;
    color: white;
    border-radius: 8px;
}

.panel {
    background: #0a1625;
    border: 1px solid #164c70;
    border-radius: 12px;
    padding: 18px;
    margin: 18px 0;
}

#response {
    color: white;
    min-height: 45px;
    line-height: 1.6;
}

h2 {
    font-size: 17px;
    color: #00c8ff;
}

</style>
</head>

<body>

<header>
<h1>J.A.R.V.I.S</h1>
<p>JUST A RATHER VERY INTELLIGENT SYSTEM</p>
<div class="status">● SYSTEM ONLINE</div>
</header>

<div class="container">

<div class="circle">◉</div>

<h2>PERSONAL AI ASSISTANT</h2>

<div class="panel">
<h2>COMMUNICATION</h2>

<p id="response">
Good day. JARVIS systems are ready.
</p>

<input id="command"
placeholder="Type a command for JARVIS...">

<br>

<button onclick="sendCommand()">
SEND COMMAND
</button>

<button onclick="listen()">
🎙️ SPEAK
</button>

<button onclick="speak('At your service.')">
🔊 TEST VOICE
</button>
</div>

<div class="panel">
<h2>QUICK ACCESS</h2>

<button onclick="openSite('https://www.youtube.com')">
YOUTUBE
</button>

<button onclick="openSite('https://www.google.com')">
GOOGLE
</button>

<button onclick="openSite('https://chatgpt.com')">
CHATGPT
</button>

<button onclick="openSite('https://github.com')">
GITHUB
</button>
</div>

<div class="panel">
<h2>🧠 JARVIS MEMORY</h2>

<input id="memory"
placeholder="Tell me something to remember">

<button onclick="saveMemory()">
SAVE MEMORY
</button>

<div id="memories"></div>
</div>

<div class="panel">
<h2>🎯 PERSONAL GOALS</h2>

<input id="goal"
placeholder="Enter a personal goal">

<button onclick="addGoal()">
ADD GOAL
</button>

<div id="goals"></div>
</div>

</div>

<script>



function respond(text) {
    document.getElementById("response").innerText = text;
    speak(text);
}

function sendCommand() {
    let command = document.getElementById("command")
        .value.trim().toLowerCase();

    if (!command) return;

    if (command.includes("hello")) {
        respond("Hello. I am JARVIS. How may I assist you?");
    }

    else if (command.includes("youtube")) {
     respond("Opening YouTube.");

function speak(text) {
    const speech = new SpeechSynthesisUtterance(text);
    speech.lang = "en-GB";
    speech.rate = 0.92;
    speech.pitch = 0.85;
    speech.volume = 1;

    const voices = window.speechSynthesis.getVoices();
    const daniel = voices.find(voice => 
        voice.name.toLowerCase().includes("daniel")
    );

    if (daniel) {
        speech.voice = daniel;
    }

    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(speech);
}

function sendCommand() {
    const command = document.getElementById("userInput").value.toLowerCase();

    if (command.includes("hello")) {
        respond("Hello. I am JARVIS. How may I assist you?");
        speak("Hello. I am JARVIS.");
    }
    else if (command.includes("youtube")) {
        respond("Opening YouTube.");
        speak("Opening YouTube.");
        window.open("https://www.youtube.com", "_blank");
    }
    else if (command.includes("google")) {
        respond("Opening Google.");
        speak("Opening Google.");
        window.open("https://www.google.com", "_blank");
    }
}
    

    else if (command.includes("google")) {
        respond("Opening Google.");
        openSite("https://www.google.com");
    }

    else if (command.includes("chatgpt")) {
        respond("Opening ChatGPT.");
        openSite("https://chatgpt.com");
    }

    else if (command.includes("time")) {
        respond("The current time is " +
        new Date().toLocaleTimeString());
    }

    else if (command.includes("goal")) {
        respond("Your goals are displayed in the personal goals panel.");
    }

    else if (command.includes("remember")) {
        respond("You can save that information in my memory panel.");
    }

    else {
        respond("I am still learning that command. My AI brain will be connected in a future upgrade.");
    }

    document.getElementById("command").value = "";
}

function openSite(url) {
    window.open(url, "_blank");
}

function saveMemory() {
    let input = document.getElementById("memory");
    let value = input.value.trim();

    if (!value) return;

    let memories = JSON.parse(
        localStorage.getItem("jarvisMemories") || "[]"
    );

    memories.push(value);

    localStorage.setItem(
        "jarvisMemories",
        JSON.stringify(memories)
    );

    input.value = "";
    showMemories();
}

function showMemories() {
    let memories = JSON.parse(
        localStorage.getItem("jarvisMemories") || "[]"
    );

    document.getElementById("memories").innerHTML =
        memories.map((m, i) =>
            `<p>${i + 1}. ${escapeHTML(m)}
            <button onclick="deleteMemory(${i})">DELETE</button>
            </p>`
        ).join("");
}

function deleteMemory(index) {
    let memories = JSON.parse(
        localStorage.getItem("jarvisMemories") || "[]"
    );

    memories.splice(index, 1);

    localStorage.setItem(
        "jarvisMemories",
        JSON.stringify(memories)
    );

    showMemories();
}

function addGoal() {
    let input = document.getElementById("goal");
    let value = input.value.trim();

    if (!value) return;

    let goals = JSON.parse(
        localStorage.getItem("jarvisGoals") || "[]"
    );

    goals.push(value);

    localStorage.setItem(
        "jarvisGoals",
        JSON.stringify(goals)
    );

    input.value = "";
    showGoals();
}

function showGoals() {
    let goals = JSON.parse(
        localStorage.getItem("jarvisGoals") || "[]"
    );

    document.getElementById("goals").innerHTML =
        goals.map((g, i) =>
            `<p>${i + 1}. ${escapeHTML(g)}
            <button onclick="deleteGoal(${i})">DELETE</button>
            </p>`
        ).join("");
}

function deleteGoal(index) {
    let goals = JSON.parse(
        localStorage.getItem("jarvisGoals") || "[]"
    );

    goals.splice(index, 1);

    localStorage.setItem(
        "jarvisGoals",
        JSON.stringify(goals)
    );

    showGoals();
}

function escapeHTML(text) {
    let div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
}

function listen() {
    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
        respond("Voice recognition is not available in this browser. Please use keyboard dictation for now.");
        return;
    }

    const recognition = new SpeechRecognition();

    recognition.lang = "en-GB";
    recognition.onresult = function(event) {
        document.getElementById("command").value =
            event.results[0][0].transcript;

        sendCommand();
    };

    recognition.onerror = function() {
        respond("I could not hear you. Please try again.");
    };

    recognition.start();
}

showMemories();
showGoals();

</script>

</body>
</html>
